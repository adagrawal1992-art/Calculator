<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test">
<title>Test</title>
<style>
  html,body{margin:0;background:#c00;color:#fff;font:15px -apple-system,system-ui,sans-serif}
  /* A: normal page flow, html/body tall */
  body{min-height:100vh;min-height:100lvh}
  .a{position:absolute;left:0;width:20%;top:0;height:100lvh;background:#1a8f3a}
  .b{position:fixed;left:20%;width:20%;top:0;bottom:0;background:#0a5fd8}
  .c{position:fixed;left:40%;width:20%;top:0;height:100lvh;background:#c98a00}
  .d{position:fixed;left:60%;width:20%;top:0;height:100dvh;background:#7a2fb8}
  .e{position:fixed;left:80%;width:20%;top:0;height:calc(100vh + 120px);background:#0aa}
  .lbl{position:fixed;left:0;right:0;top:40%;text-align:center;font-weight:700;font-size:16px;line-height:1.5;text-shadow:0 1px 2px #000;z-index:5}
  .k{position:fixed;left:0;right:0;bottom:0;display:flex;font-weight:700;font-size:13px;z-index:5}
  .k div{flex:1;text-align:center;padding:4px 0;background:rgba(0,0,0,.4)}
</style>
</head>
<body>
  <div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div><div class="e"></div>
  <div class="lbl" id="info"></div>
  <div class="k"><div>A</div><div>B</div><div>C</div><div>D</div><div>E</div></div>
<script>
  function upd(){
    document.getElementById('info').innerHTML=
      'screen: '+screen.width+'×'+screen.height+'<br>inner: '+innerWidth+'×'+innerHeight+
      '<br>visual: '+(window.visualViewport?Math.round(visualViewport.height):'-')+
      '<br>standalone: '+(navigator.standalone?'yes':'no')+
      '<br>iOS: '+((navigator.userAgent.match(/OS (\d+[_\d]*)/)||[])[1]||'?').replace(/_/g,'.');
  }
  upd(); addEventListener('resize',upd);
</script>
</body>
</html>
